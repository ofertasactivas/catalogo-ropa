<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Administrar catálogo</title>
<style>
:root{--ink:#1F3F66;--blue:#2D6AA8;--sun:#FFC843;--bg:#F8FBFF;--line:#DCE9F6;--mut:#6B7F97}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:16px;max-width:900px;margin:auto}
h1{color:var(--blue);font-size:24px}input,button{font:inherit}
input[type=text],input[type=password],input[type=search],input[type=number]{width:100%;padding:10px;border:2px solid var(--line);border-radius:10px;margin:4px 0 10px}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}
button.s{background:var(--sun);color:var(--ink)}.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
#st{position:sticky;top:0;background:var(--ink);color:#fff;padding:8px 12px;border-radius:10px;margin-bottom:10px;display:none;z-index:3}
.it{display:grid;grid-template-columns:1fr;gap:8px}.hd{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.th{display:flex;gap:8px;flex-wrap:wrap}.th div{position:relative}.th img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:3px solid var(--line)}
.th div:first-child img{border-color:var(--sun)}
.th button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;padding:0;border-radius:50%;background:#d33}
.th .st2{right:auto;left:-6px;background:var(--ink)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row input[type=number]{width:110px;margin:0}
small{color:var(--mut)}
.nm{display:flex;gap:8px;align-items:center}.nm input{margin:0}.nm .z{width:96px;flex:none}
.it.vend{background:#EEF3F9}.it.vend .th img{opacity:.55}
#sum{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}#sum b{font-size:20px;display:block}
select{font:inherit;padding:9px;border:2px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;background:#fff;color:var(--ink);border:2px solid var(--line)}.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.ord{border-left:6px solid var(--sun)}.ord .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ord .btns button{flex:1;min-width:120px}
.ord .g{background:#1FA855}.ord .x{background:#fff;color:#c0392b;border:2px solid #f0c9c4}.big{font-size:18px}
.ls{display:flex;gap:10px;flex-wrap:wrap}.ls button{flex:1}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script></head><body>
<h1>Administrar catálogo</h1>
<div id="login" class="box"><b>Conectar con GitHub</b><br><small>El token se guarda solo en este navegador.</small>
<input type="text" id="repo" placeholder="usuario/repositorio (ej: armando/catalogo-ropa)">
<input type="password" id="tok" placeholder="Token de GitHub">
<button id="enter">Entrar</button></div>
<div id="st"></div>
<div id="app" hidden>
<div class="tabs"><button id="tc" class="on">Catálogo</button><button id="tl">Modo Live</button></div>
<div id="tabC">
<div class="box"><div class="row"><label>WhatsApp (con código de país)<input type="text" id="wa"></label><button id="sw" class="s">Guardar número</button></div></div>
<div class="box" id="sum"></div>
<input type="search" id="q" placeholder="Buscar prenda o número…">
<select id="flt"><option value="">Todas</option><option value="d">Solo disponibles</option><option value="v">Solo vendidas</option></select>
<div id="list"></div></div>
<div id="tabL" hidden>
<div class="box"><b>Nuevo pedido</b><br><small>Escribe el nombre y los números de prenda en una sola línea. Ejemplo: <i>María 12 45 60</i></small>
<input type="text" id="lo" placeholder="María 12 45 60" autocomplete="off" enterkeyhint="done">
<input type="text" id="lp" placeholder="WhatsApp del cliente (opcional)" inputmode="tel">
<div class="row"><label>QR para el cliente <select id="lq"><option value="t">Tienda</option><option value="w">Mi WhatsApp</option></select></label></div>
<button id="lmk" class="s big">Crear pedido</button></div>
<div class="box" id="ltot"></div>
<div id="olist"></div>
<div class="ls"><button id="lcp" class="s">Copiar resumen</button><button id="lcsv" class="s">Descargar CSV</button><button id="lend" class="x" style="background:#fff;color:#c0392b;border:2px solid #f0c9c4">Cerrar live</button></div>
</div>
<p><button id="out" class="s">Salir</button></p></div>
<script>
const $=id=>document.getElementById(id);let repo,tok,sha,CFG,chain=Promise.resolve();
const api=p=>`https://api.github.com/repos/${repo}/contents/${p}`;
const H=()=>({Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"});
const msg=(t,ok=true)=>{const s=$("st");s.style.display="block";s.textContent=t;s.style.background=ok?"#1F3F66":"#c0392b";if(ok&&/Guardado/.test(t))setTimeout(()=>s.style.display="none",2500)};
async function load(){const r=await fetch(api("catalogo.json"),{headers:H()});if(!r.ok)throw new Error("No se pudo entrar (error "+r.status+"). 404 = nombre del repositorio incorrecto; 401 = token mal copiado.");
 const j=await r.json();sha=j.sha;CFG=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))));}
const doSave=async()=>{msg("Guardando…");const body={message:"Actualizar catálogo",sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(CFG,null,1))))};
 const r=await fetch(api("catalogo.json"),{method:"PUT",headers:H(),body:JSON.stringify(body)});
 if(!r.ok){msg("Error al guardar ("+r.status+")",false);return}sha=(await r.json()).content.sha;msg("Guardado. Se verá en la tienda en 1-2 minutos.")};
const save=()=>chain=chain.then(doSave).catch(e=>msg(e.message,false));
function shrink(file){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement("canvas");
 c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8).split(",")[1])};im.src=URL.createObjectURL(file)})}
async function upload(id,files){const it=CFG.items.find(x=>x.id==id);let n=0;
 for(const f of files){msg(`Subiendo foto ${++n} de ${files.length}…`);const path=`fotos/${id}-${Date.now()}-${n}.jpg`;
  const r=await fetch(api(path),{method:"PUT",headers:H(),body:JSON.stringify({message:"Foto "+id,content:await shrink(f)})});
  if(!r.ok){msg("Error al subir foto ("+r.status+")",false);return}it.f.push(path)}
 await save();draw()}
const esc=x=>String(x||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const bs=n=>"Bs "+n.toLocaleString("es-BO");
function summary(){const v=CFG.items.filter(d=>d.v),a=CFG.items.filter(d=>!d.v),t=l=>l.reduce((x,d)=>x+d.p,0);
 $("sum").innerHTML=`<div><small>Vendidas</small><b>${v.length} · ${bs(t(v))}</b></div><div><small>Disponibles</small><b>${a.length} · ${bs(t(a))}</b></div>`}
function draw(){const q=$("q").value.toLowerCase(),f=$("flt").value;summary();
 $("list").innerHTML=CFG.items.filter(d=>(!q||(d.n+" "+d.id).toLowerCase().includes(q))&&(!f||(f=="v")==!!d.v)).map(d=>`<div class="box it${d.v?" vend":""}" data-id="${d.id}">
 <div class="nm"><b>N° ${d.id}</b><input type="text" value="${esc(d.n)}" data-a="name" aria-label="Nombre"><input class="z" type="text" value="${esc(d.t)}" placeholder="Talla" data-a="size" aria-label="Talla"></div>
 <div class="th">${d.f.map((u,i)=>`<div><img src="${u}"><button data-a="del" data-i="${i}">×</button>${i?`<button class="st2" data-a="main" data-i="${i}">★</button>`:""}</div>`).join("")}</div>
 <div class="row"><input type="file" accept="image/*" multiple data-a="up"><label>Bs <input type="number" value="${d.p}" data-a="price"></label>
 <label><input type="checkbox" data-a="sold" ${d.v?"checked":""}> Vendido</label>${d.v&&d.vf?`<small>Vendida el ${d.vf}</small>`:""}</div></div>`).join("")}
$("list").onclick=e=>{const b=e.target.closest("button");if(!b)return;const id=+b.closest(".it").dataset.id,it=CFG.items.find(x=>x.id==id),i=+b.dataset.i;
 if(b.dataset.a=="del"){it.f.splice(i,1);save();draw()}if(b.dataset.a=="main"){it.f.unshift(...it.f.splice(i,1));save();draw()}};
$("list").onchange=e=>{const t=e.target,a=t.dataset.a,id=+t.closest(".it").dataset.id,it=CFG.items.find(x=>x.id==id);
 if(a=="up"&&t.files.length)upload(id,[...t.files]);if(a=="name"){it.n=t.value.trim()||it.n;save()}if(a=="size"){it.t=t.value.trim();save()}
 if(a=="price"){it.p=+t.value;save();summary()}
 if(a=="sold"){it.v=t.checked;if(t.checked)it.vf=new Date().toISOString().slice(0,10);else delete it.vf;save();draw()}};
$("q").oninput=draw;$("flt").onchange=draw;
$("sw").onclick=()=>{CFG.whatsapp=$("wa").value.replace(/\D/g,"");save()};
async function enter(){try{await load();$("login").hidden=true;$("app").hidden=false;$("wa").value=CFG.whatsapp;draw()}catch(e){msg(e.message,false);$("login").hidden=false}}
$("enter").onclick=()=>{repo=$("repo").value.trim().replace(/^\/+|\/+$/g,"");tok=$("tok").value.trim();localStorage.setItem("rk",JSON.stringify({repo,tok}));enter()};
$("out").onclick=()=>{localStorage.removeItem("rk");location.reload()};
try{const s=JSON.parse(localStorage.getItem("rk")||"null");if(s){repo=s.repo;tok=s.tok;enter()}}catch(e){}

/* ===== MODO LIVE ===== */
const LS="rk_orders";let ORD=[];try{ORD=JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){}
const saveOrd=()=>{try{localStorage.setItem(LS,JSON.stringify(ORD))}catch(e){}};
const shopURL=()=>location.href.replace(/[?#].*$/,"").replace(/[^/]*$/,"");
const phoneOf=v=>{v=String(v||"").replace(/\D/g,"");return v.length==8?"591"+v:v};
function tab(w){$("tabC").hidden=w!="c";$("tabL").hidden=w!="l";$("tc").classList.toggle("on",w=="c");$("tl").classList.toggle("on",w=="l");if(w=="l")liveDraw()}
$("tc").onclick=()=>tab("c");$("tl").onclick=()=>tab("l");
const itxt=i=>`• N° ${i.id} – ${i.n}${i.t?" ("+i.t+")":""} – Bs ${i.p}`;
const otxt=o=>`¡Hola ${o.name}! Gracias por tu compra en La Recolecta Kids 🧸\n\nTu pedido:\n`+o.items.map(itxt).join("\n")+`\n\nTotal: Bs ${o.total}\n\nMás prendas: ${shopURL()}`;
function mkOrder(){const raw=$("lo").value.trim();if(!raw)return;
 const nums=[...new Set((raw.match(/\d+/g)||[]).map(Number))],name=raw.replace(/\d+/g," ").replace(/[,;]/g," ").replace(/\s+/g," ").trim()||"Cliente";
 const ok=[],bad=[];nums.forEach(n=>{const it=CFG.items.find(x=>x.id==n);(!it||it.v)?bad.push(n):ok.push(it)});
 if(!ok.length){msg("Ninguna disponible"+(bad.length?" ("+bad.join(", ")+" ya vendidas o no existen)":"")+". Escribe el nombre y los números.",false);return}
 const today=new Date().toISOString().slice(0,10);
 const o={id:Date.now(),name,phone:phoneOf($("lp").value),q:$("lq").value,items:ok.map(i=>({id:i.id,n:i.n,t:i.t,p:i.p})),total:ok.reduce((a,i)=>a+i.p,0)};
 ORD.unshift(o);saveOrd();ok.forEach(it=>{it.v=true;it.vf=today});save();draw();
 $("lo").value="";$("lp").value="";liveDraw();if(bad.length)msg("Ya vendidas o inexistentes (no incluidas): "+bad.join(", "),false);$("lo").focus()}
function liveDraw(){const t=ORD.reduce((a,o)=>a+o.total,0),n=ORD.reduce((a,o)=>a+o.items.length,0);
 $("ltot").innerHTML=`<div id="sum"><div><small>Pedidos</small><b>${ORD.length}</b></div><div><small>Prendas</small><b>${n}</b></div><div><small>Total del live</small><b>${bs(t)}</b></div></div>`;
 $("olist").innerHTML=ORD.map((o,i)=>`<div class="box ord"><b class="big">${esc(o.name)} · ${bs(o.total)}</b><br><small>${o.items.map(x=>"N° "+x.id).join(", ")}</small>
 <div class="btns"><button class="g" data-a="img" data-i="${i}">Enviar imagen con QR</button><button data-a="txt" data-i="${i}">Enviar texto</button><button class="x" data-a="undo" data-i="${i}" style="background:#fff;color:#c0392b;border:2px solid #f0c9c4">Deshacer</button></div></div>`).join("")}
const loadImg=u=>new Promise((r,j)=>{const m=new Image();m.onload=()=>r(m);m.onerror=j;m.src=u});
async function card(o){const rows=o.items.length,H=560+rows*54+380,c=document.createElement("canvas");c.width=1080;c.height=H;const x=c.getContext("2d");
 x.fillStyle="#F8FBFF";x.fillRect(0,0,1080,H);x.fillStyle="#fff";x.fillRect(0,0,1080,250);x.fillStyle="#FFC843";x.fillRect(0,250,1080,12);
 try{const l=await loadImg("logo.jpg");x.save();x.beginPath();x.arc(140,125,95,0,7);x.clip();x.drawImage(l,45,30,190,190);x.restore()}catch(e){}
 x.fillStyle="#2D6AA8";x.font="700 56px system-ui,sans-serif";x.fillText("¡Gracias, "+o.name+"!",270,115);
 x.fillStyle="#F77EB0";x.font="700 38px system-ui,sans-serif";x.fillText("La Recolecta Kids",270,175);
 x.fillStyle="#1F3F66";x.font="700 40px system-ui,sans-serif";x.fillText("Tu pedido",50,340);
 o.items.forEach((it,k)=>{const y=370+k*54;if(k%2==0){x.fillStyle="#EAF3FC";x.fillRect(30,y,1020,50)}
  x.fillStyle="#2D6AA8";x.font="700 30px system-ui,sans-serif";x.fillText("N° "+it.id,50,y+36);
  x.fillStyle="#1F3F66";x.font="600 28px system-ui,sans-serif";let t=it.n+(it.t?" ("+it.t+")":"");while(x.measureText(t).width>600&&t.length>8)t=t.slice(0,-2);x.fillText(t,170,y+36);
  x.fillStyle="#2D6AA8";x.font="700 32px system-ui,sans-serif";const s="Bs "+it.p;x.fillText(s,1030-x.measureText(s).width,y+36)});
 const ty=370+rows*54+30;x.fillStyle="#1F3F66";x.fillRect(30,ty,1020,90);x.fillStyle="#fff";x.font="700 48px system-ui,sans-serif";x.fillText("TOTAL",60,ty+62);
 const tt="Bs "+o.total;x.fillText(tt,1020-x.measureText(tt).width,ty+62);
 const data=o.q=="w"?"https://wa.me/"+CFG.whatsapp:shopURL(),q=qrcode(0,"M");q.addData(data);q.make();const n=q.getModuleCount(),cell=Math.floor(320/n),sz=cell*n,qy=ty+150;
 x.fillStyle="#fff";x.fillRect(50,qy,sz+60,sz+60);x.strokeStyle="#7CC3F0";x.lineWidth=5;x.strokeRect(50,qy,sz+60,sz+60);x.fillStyle="#1F3F66";
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(80+k*cell,qy+30+r*cell,cell,cell);
 x.fillStyle="#2D6AA8";x.font="700 40px system-ui,sans-serif";x.fillText(o.q=="w"?"Escríbenos por WhatsApp":"Mira más prendas",sz+150,qy+90);
 x.fillStyle="#1F3F66";x.font="600 30px system-ui,sans-serif";x.fillText("Escanea el QR con tu celular",sz+150,qy+140);x.fillText("¡Gracias por tu compra! 🧸",sz+150,qy+190);
 return new Promise(r=>c.toBlob(r,"image/png"))}
$("lmk").onclick=mkOrder;$("lo").onkeydown=e=>{if(e.key=="Enter")mkOrder()};
$("olist").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i,o=ORD[i],a=b.dataset.a;
 const wa=()=>"https://wa.me/"+(o.phone||"")+"?text="+encodeURIComponent(otxt(o));
 if(a=="txt")window.open(wa(),"_blank");
 if(a=="img"){const blob=await card(o),f=new File([blob],"pedido-"+o.name+".png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:otxt(o)})}catch(err){}}
  else{const u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download=f.name;l.click();window.open(wa(),"_blank")}}
 if(a=="undo"&&confirm("¿Deshacer el pedido de "+o.name+"? Sus prendas vuelven a estar disponibles.")){o.items.forEach(x=>{const it=CFG.items.find(y=>y.id==x.id);if(it){it.v=false;delete it.vf}});ORD.splice(i,1);saveOrd();save();draw();liveDraw()}};
const summ=()=>ORD.slice().reverse().map(o=>`${o.name}: ${o.items.map(i=>i.id).join(", ")} = Bs ${o.total}`).join("\n")+`\nTOTAL: Bs ${ORD.reduce((a,o)=>a+o.total,0)}`;
$("lcp").onclick=async()=>{try{await navigator.clipboard.writeText(summ());msg("Resumen copiado.")}catch(e){msg("No se pudo copiar.",false)}};
$("lcsv").onclick=()=>{const r=["Cliente,WhatsApp,Prendas,Total"].concat(ORD.slice().reverse().map(o=>`"${o.name}","${o.phone}","${o.items.map(i=>i.id).join(" ")}",${o.total}`)),u=URL.createObjectURL(new Blob(["\ufeff"+r.join("\n")],{type:"text/csv"})),l=document.createElement("a");l.href=u;l.download="live-"+new Date().toISOString().slice(0,10)+".csv";l.click()};
$("lend").onclick=()=>{if(confirm("¿Cerrar el live y borrar la lista de pedidos de este celular? Las prendas siguen marcadas como vendidas.")){ORD=[];saveOrd();liveDraw()}};
</script></body></html>
