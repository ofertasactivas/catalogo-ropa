<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Recolecta Kids · Catálogo</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F3F66;--blue:#2D6AA8;--sky:#7CC3F0;--pink:#F77EB0;--sun:#FFC843;--bg:#F8FBFF;--mut:#6B7F97;--wa:#1FA855;--line:#DCE9F6}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
header{max-width:1100px;margin:auto;padding:18px;display:flex;gap:16px;align-items:center}
header img{width:84px;height:84px;border-radius:50%;flex:none}
h1{font:600 clamp(24px,5vw,38px)/1.05 Fredoka,sans-serif;margin:0 0 4px;color:var(--blue)}
header p{margin:0;color:var(--mut);font-size:15px}
.bar{position:sticky;top:0;background:var(--bg);padding:12px 18px;z-index:5;max-width:1100px;margin:auto;border-bottom:1px solid var(--line)}
input[type=search]{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff}
input:focus,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.chip{flex:none;border:2px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font:700 14px Nunito;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.row2{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px;color:var(--mut)}
select{font:inherit;padding:6px;border-radius:8px;border:2px solid var(--line);background:#fff}
main{max-width:1100px;margin:auto;padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;position:relative}
.strip{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;cursor:zoom-in}
.dots{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.6;box-shadow:0 0 2px rgba(0,0,0,.4)}
.dots i.a{opacity:1;background:var(--sun)}
#lb{position:fixed;inset:0;background:rgba(15,30,50,.94);z-index:20;display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lbi{max-width:100%;max-height:86vh;object-fit:contain;touch-action:pinch-zoom}
#lb button{position:absolute;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:50%;width:46px;height:46px;font-size:24px;cursor:pointer}
#lbx{top:14px;right:14px}#lbp{left:10px;top:50%}#lbn{right:10px;top:50%}
#lbc{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-weight:800}
.code,.nf{position:absolute;bottom:8px;background:#fff;border-radius:8px;padding:2px 8px;font:800 12px Nunito}
.code{left:8px}.nf{right:8px;background:var(--ink);color:#fff}
.sold{position:absolute;inset:0;background:rgba(248,251,255,.85);display:grid;place-items:center;font:600 20px Fredoka;color:var(--blue)}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:800;font-size:15px;line-height:1.2}
.size{font-size:13px;color:var(--mut)}
.price{font:600 22px Fredoka;margin-top:auto;color:var(--blue)}
.add{margin-top:6px;border:0;border-radius:10px;padding:10px;font:800 14px Nunito;cursor:pointer;background:var(--sun);color:var(--ink)}
.add.in{background:var(--blue);color:#fff}
.add:disabled{background:var(--line);color:var(--mut);cursor:default}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0}
#cart{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:12px 18px;display:none;z-index:9}
#cart.show{display:block}
.ci{max-width:1100px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.ci b{font:600 20px Fredoka}.ci small{display:block;opacity:.75}
.go{background:var(--wa);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:800 15px Nunito;cursor:pointer}
.clear{background:none;border:0;color:#fff;opacity:.7;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
</style></head><body>
<header><img src="logo.jpg" alt="La Recolecta Kids"><div><h1>La Recolecta Kids</h1><p>Ropa y accesorios para los más pequeños. Cada prenda es única: agrégala a tu pedido y envíalo por WhatsApp.</p></div></header>
<div class="bar">
<input type="search" id="q" placeholder="Buscar: vestido, Tommy, T6, 2 años…" aria-label="Buscar">
<div class="chips" id="chips"></div>
<div class="row2"><span id="count"></span><label>Ordenar <select id="sort"><option value="n">Número</option><option value="a">Precio: menor a mayor</option><option value="d">Precio: mayor a menor</option></select></label></div>
</div>
<main id="grid"><div class="empty">Cargando…</div></main>
<div id="lb"><img id="lbi" alt=""><button id="lbx" aria-label="Cerrar">×</button><button id="lbp" class="nv" aria-label="Anterior">‹</button><button id="lbn" class="nv" aria-label="Siguiente">›</button><div id="lbc"></div></div>
<div id="cart"><div class="ci"><div><b id="ctot"></b><small id="cn"></small><button class="clear" id="clr">Vaciar</button></div><button class="go" id="send">Enviar pedido por WhatsApp</button></div></div>
<script>
let CFG={items:[]},cat="Todo",sel=new Set();
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
fetch("catalogo.json?"+Date.now()).then(r=>r.json()).then(j=>{CFG=j;
 const cats=["Todo",...new Set(j.items.map(d=>d.c))];
 $("chips").innerHTML=cats.map(c=>`<button class="chip${c=="Todo"?" on":""}" data-c="${c}">${c}</button>`).join("");
 render()}).catch(()=>$("grid").innerHTML='<div class="empty">No se pudo cargar el catálogo.</div>');
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;
 document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x==b));render()};
$("q").oninput=render;$("sort").onchange=render;
function render(){
 const q=norm($("q").value.trim()),s=$("sort").value;
 let l=CFG.items.filter(d=>(cat=="Todo"||d.c==cat)&&(!q||norm(d.n+" "+d.t+" "+d.id).includes(q)));
 l.sort((a,b)=>s=="a"?a.p-b.p||a.id-b.id:s=="d"?b.p-a.p||a.id-b.id:a.id-b.id);
 $("count").textContent=l.length+" prendas";
 $("grid").innerHTML=l.length?l.map(d=>{const i=sel.has(d.id),f=d.f||[];
  return `<article class="card"><div class="ph" style="background:${d.k}">${f.length?`<div class="strip">${f.map((u,j)=>`<img src="${u}" data-id="${d.id}" data-i="${j}" loading="lazy" alt="${d.n}">`).join("")}</div>`:""}${f.length>1?`<div class="dots">${f.map((_,j)=>`<i class="${j?"":"a"}"></i>`).join("")}</div>`:""}
  <span class="code">N° ${d.id}</span>${f.length>1?`<span class="nf">${f.length} fotos ›</span>`:""}${d.v?'<div class="sold">Vendido</div>':""}</div>
  <div class="info"><div class="name">${d.n}</div><div class="size">${d.t?"Talla "+d.t:"Consultar talla"}</div><div class="price">Bs ${d.p}</div>
  <button class="add${i?" in":""}" data-id="${d.id}" ${d.v?"disabled":""}>${d.v?"No disponible":i?"Quitar":"Agregar al pedido"}</button></div></article>`}).join(""):'<div class="empty">No encontramos prendas con esa búsqueda.</div>';
}
$("grid").onclick=e=>{const im=e.target.closest(".strip img");if(im){lbOpen(+im.dataset.id,+im.dataset.i);return}const b=e.target.closest(".add");if(!b)return;const id=+b.dataset.id;
 sel.has(id)?sel.delete(id):sel.add(id);render();cart()};
const chosen=()=>CFG.items.filter(d=>sel.has(d.id));
function cart(){const l=chosen(),t=l.reduce((a,d)=>a+d.p,0);
 $("cart").classList.toggle("show",l.length>0);$("ctot").textContent="Bs "+t;
 $("cn").textContent=l.length+(l.length==1?" prenda":" prendas")+" en tu pedido"}
$("clr").onclick=()=>{sel.clear();render();cart()};
$("send").onclick=()=>{const l=chosen(),t=l.reduce((a,d)=>a+d.p,0);
 const m=`Hola, quiero hacer un pedido en ${CFG.tienda}:\n\n`+l.map(d=>`• N° ${d.id} – ${d.n}${d.t?" (T. "+d.t+")":""} – Bs ${d.p}`).join("\n")+`\n\nTotal: Bs ${t}\n¿Siguen disponibles?`;
 window.open("https://wa.me/"+CFG.whatsapp+"?text="+encodeURIComponent(m),"_blank")};
$("grid").addEventListener("scroll",e=>{const t=e.target;if(!t.classList||!t.classList.contains("strip"))return;
 const i=Math.round(t.scrollLeft/t.clientWidth);t.parentNode.querySelectorAll(".dots i").forEach((x,j)=>x.classList.toggle("a",j==i))},true);
let LB={f:[],i:0};const lb=$("lb");
function lbShow(){$("lbi").src=LB.f[LB.i];$("lbc").textContent=LB.f.length>1?(LB.i+1)+" / "+LB.f.length:"";
 lb.querySelectorAll(".nv").forEach(b=>b.style.display=LB.f.length>1?"":"none")}
function lbOpen(id,i){LB={f:CFG.items.find(d=>d.id==id).f,i};document.body.style.overflow="hidden";lb.classList.add("on");lbShow()}
function lbClose(){lb.classList.remove("on");document.body.style.overflow=""}
const lbMove=n=>{LB.i=(LB.i+n+LB.f.length)%LB.f.length;lbShow()};
$("lbp").onclick=e=>{e.stopPropagation();lbMove(-1)};$("lbn").onclick=e=>{e.stopPropagation();lbMove(1)};
lb.onclick=e=>{if(e.target===lb||e.target.id=="lbx")lbClose()};
document.onkeydown=e=>{if(!lb.classList.contains("on"))return;if(e.key=="Escape")lbClose();if(e.key=="ArrowLeft")lbMove(-1);if(e.key=="ArrowRight")lbMove(1)};
let sx=0;lb.ontouchstart=e=>{sx=e.touches[0].clientX};
lb.ontouchend=e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60&&LB.f.length>1)lbMove(d<0?1:-1)};
</script></body></html>
